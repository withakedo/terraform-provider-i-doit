name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: gofmt
        # Informational: the maintenance job re-applies gofmt on main and
        # commits the result, so this never blocks a run.
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then
            echo "::warning::not gofmt -s clean:"
            echo "$out"
          fi

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  maintenance:
    name: tidy go.sum
    # Regenerates go.sum and re-applies gofmt on pushes to the canonical repo,
    # committing the result so the module is reproducible and cache-friendly.
    if: github.event_name == 'push' && github.repository == 'withakedo/terraform-provider-i-doit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Tidy and format
        run: |
          go mod tidy
          gofmt -s -w .

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "go.sum and formatting already up to date"
            exit 0
          fi
          git config user.name "withakedo"
          git config user.email "withakefynn@gmail.com"
          git add -A
          git commit -m "chore: regenerate go.sum and apply gofmt"
          git push
